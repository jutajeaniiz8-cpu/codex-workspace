name: Universal File Reader CI

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "AGENTS.md"
      - ".agents/skills/universal-file-reader/**"
      - ".github/workflows/universal-file-reader-ci.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - "AGENTS.md"
      - ".agents/skills/universal-file-reader/**"
      - ".github/workflows/universal-file-reader-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run universal file reader self-test
        run: python .agents/skills/universal-file-reader/scripts/self_test.py
